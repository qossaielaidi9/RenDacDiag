# Livrable 2 : Qdrant + API. Aucun GPU nécessaire à ce stade.
# MinIO et PostgreSQL arrivent avec le serveur MCP (livrable 4) ; en L2, les fichiers d'origine sont copiés dans data/store.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["./data/qdrant:/qdrant/storage"]
  api:
    build: .
    env_file: .env
    environment:
      RDD_QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    volumes: ["./data:/app/data", "hf-cache:/root/.cache/huggingface"]
    depends_on: [qdrant]
volumes:
  hf-cache:
